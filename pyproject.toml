[project]
name = "blind-mcp"
version = "0.3.1"
description = "Find what a role actually pays, including where the employer publishes nothing -- reads public job-board APIs (Greenhouse, Ashby, Lever, Workday) for published salary bands, per seniority and per currency."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "mcp>=2"]
keywords = ["mcp", "model-context-protocol", "mcp-server", "salary", "compensation", "pay-transparency", "greenhouse", "workday", "careers", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/dheerajjha/blind-mcp"
Issues = "https://github.com/dheerajjha/blind-mcp/issues"
Contributing = "https://github.com/dheerajjha/blind-mcp/blob/main/CONTRIBUTING.md"

[project.scripts]
blind-mcp = "blind_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blind_mcp"]

[dependency-groups]
dev = [
    "pytest>=8",
]
